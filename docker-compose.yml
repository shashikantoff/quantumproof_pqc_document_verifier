services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: verifier
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: verifier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier -d verifier"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      target: runtime
    platform: linux/amd64
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://verifier:verifier@db:5432/verifier
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pqc-keys:/var/lib/pqc-keys

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

  api-tests:
    build:
      context: ./backend
      target: test
    platform: linux/amd64
    profiles: ["test"]

  issuer-tools:
    image: quantum-document-verifier-issuer-tools
    build:
      context: ./backend
      target: issuer-tools
    platform: linux/amd64
    profiles: ["issuer-tools"]
    volumes:
      - ./issuer-workspace:/issuer-workspace

  alertmanager-config:
    image: python:3.12-slim-bookworm@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
    profiles: ["monitoring"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager.yml.template:/template/alertmanager.yml.template:ro
      - ./monitoring/render_alertmanager_config.py:/template/render_alertmanager_config.py:ro
      - alertmanager-config:/output
    command: ["python", "/template/render_alertmanager_config.py"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.8.0@sha256:d936808bdea528155c0154a922cd42fd75716b8bb7ba302641350f9f3eaeba09
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - alertmanager-config:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

volumes:
  postgres-data:
  pqc-keys:
  prometheus-data:
  alertmanager-data:
  alertmanager-config:
